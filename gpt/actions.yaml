components:
  schemas:
    ADRAlternativeSchema:
      properties:
        name:
          type: string
          title: Name
          description: Alternative option name
        description:
          type: string
          title: Description
          description: Brief description of the alternative
        pros:
          items:
            type: string
          type: array
          title: Pros
        cons:
          items:
            type: string
          type: array
          title: Cons
      type: object
      required:
      - name
      - description
      title: ADRAlternativeSchema
    ADRCreateRequest:
      properties:
        title:
          type: string
          title: Title
          description: ADR title
        context:
          type: string
          title: Context
          description: Decision context
        alternatives:
          items:
            $ref: '#/components/schemas/ADRAlternativeSchema'
          type: array
          title: Alternatives
          description: Options considered
        decision:
          type: string
          title: Decision
          description: The decision made
        consequences:
          items:
            type: string
          type: array
          title: Consequences
          description: Consequences of the decision
        rationale:
          type: string
          title: Rationale
          description: Reasoning behind the decision
        related_prd_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Related Prd Id
        related_initiative_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Related Initiative Id
      type: object
      required:
      - title
      - context
      - alternatives
      - decision
      - consequences
      - rationale
      title: ADRCreateRequest
    ADRCreateResponse:
      properties:
        adr_id:
          type: string
          title: Adr Id
        title:
          type: string
          title: Title
        status:
          type: string
          title: Status
        alternatives_count:
          type: integer
          title: Alternatives Count
        consequences_count:
          type: integer
          title: Consequences Count
      type: object
      required:
      - adr_id
      - title
      - status
      - alternatives_count
      - consequences_count
      title: ADRCreateResponse
    AccountSummaryRequest:
      properties:
        account_id:
          type: string
          title: Account Id
        signals:
          items:
            $ref: '#/components/schemas/SignalIngestResponse'
          type: array
          title: Signals
      type: object
      required:
      - account_id
      - signals
      title: AccountSummaryRequest
    AccountSummaryResponse:
      properties:
        account_id:
          type: string
          title: Account Id
        total_signals:
          type: integer
          title: Total Signals
        primary_problems:
          items:
            type: string
          type: array
          title: Primary Problems
        overall_sentiment:
          type: string
          title: Overall Sentiment
        churn_risk:
          type: string
          title: Churn Risk
      type: object
      required:
      - account_id
      - total_signals
      - primary_problems
      - overall_sentiment
      - churn_risk
      title: AccountSummaryResponse
    AnomalyRequest:
      properties:
        metric_name:
          type: string
          title: Metric Name
        baseline_value:
          type: number
          title: Baseline Value
        observed_value:
          type: number
          title: Observed Value
      type: object
      required:
      - metric_name
      - baseline_value
      - observed_value
      title: AnomalyRequest
    AnomalyResponse:
      properties:
        metric_name:
          type: string
          title: Metric Name
        baseline_value:
          type: number
          title: Baseline Value
        observed_value:
          type: number
          title: Observed Value
        magnitude_pct:
          type: number
          title: Magnitude Pct
        is_anomaly:
          type: boolean
          title: Is Anomaly
        potential_causes:
          items:
            type: string
          type: array
          title: Potential Causes
      type: object
      required:
      - metric_name
      - baseline_value
      - observed_value
      - magnitude_pct
      - is_anomaly
      - potential_causes
      title: AnomalyResponse
    AssumptionCreateRequest:
      properties:
        statement:
          type: string
          title: Statement
        category:
          type: string
          title: Category
          default: MARKET
        confidence:
          type: string
          title: Confidence
          default: MEDIUM
        validation_criteria:
          type: string
          title: Validation Criteria
          default: ''
      type: object
      required:
      - statement
      title: AssumptionCreateRequest
    AssumptionResponse:
      properties:
        assumption_id:
          type: string
          title: Assumption Id
        statement:
          type: string
          title: Statement
        category:
          type: string
          title: Category
        confidence:
          type: string
          title: Confidence
        status:
          type: string
          title: Status
      type: object
      required:
      - assumption_id
      - statement
      - category
      - confidence
      - status
      title: AssumptionResponse
    BetEvaluateRequest:
      properties:
        name:
          type: string
          title: Name
        hypothesis:
          type: string
          title: Hypothesis
        evidence_strength:
          type: number
          title: Evidence Strength
          default: 0.7
        investment_size:
          type: string
          title: Investment Size
          default: MEDIUM
        market_uncertainty:
          type: number
          title: Market Uncertainty
          default: 0.5
      type: object
      required:
      - name
      - hypothesis
      title: BetEvaluateRequest
    BetEvaluateResponse:
      properties:
        bet_name:
          type: string
          title: Bet Name
        viability_score:
          type: number
          title: Viability Score
        recommendation:
          type: string
          title: Recommendation
        evidence_strength:
          type: number
          title: Evidence Strength
        market_uncertainty:
          type: number
          title: Market Uncertainty
        validation_milestones:
          items:
            type: string
          type: array
          title: Validation Milestones
      type: object
      required:
      - bet_name
      - viability_score
      - recommendation
      - evidence_strength
      - market_uncertainty
      - validation_milestones
      title: BetEvaluateResponse
    BlockerAnalysisResponse:
      properties:
        epic_entity_id:
          type: string
          title: Epic Entity Id
        total_blockers:
          type: integer
          title: Total Blockers
        blockers:
          items:
            $ref: '#/components/schemas/BlockerSchema'
          type: array
          title: Blockers
      type: object
      required:
      - epic_entity_id
      - total_blockers
      - blockers
      title: BlockerAnalysisResponse
    BlockerSchema:
      properties:
        blocked_entity_id:
          type: string
          title: Blocked Entity Id
        blocked_name:
          type: string
          title: Blocked Name
        blocking_entity_id:
          type: string
