openapi: 3.1.0
info:
  title: TPG — The Product Guy
  description: TPG Backend Intelligence Service. Powers the Knowledge Graph, Connector
    Framework, and Specialist Agent orchestration behind the unified TPG identity
    in ChatGPT.
  version: 0.1.0
servers:
- url: https://carriers-crafts-inflation-zealand.trycloudflare.com
  description: TPG Live Intelligence Backend (Cloudflare Tunnel)
security:
- ApiKeyAuth: []
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      description: 'System health check.


        Verifies database connectivity and returns basic system info.

        Called by monitoring and by the Custom GPT to verify availability.'
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /workspace/me:
    get:
      tags:
      - Workspace & Security
      summary: Get Current Workspace
      description: Retrieves profile details for the current active workspace.
      operationId: get_current_workspace_workspace_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memory/store:
    post:
      tags:
      - Memory
      summary: Store Knowledge
      description: 'Store a piece of knowledge in TPG''s Knowledge Graph.


        This is the primary write path for all product intelligence.

        ChatGPT calls this whenever TPG needs to remember something.'
      operationId: store_knowledge_memory_store_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryStoreRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryStoreResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memory/recall:
    post:
      tags:
      - Memory
      summary: Recall Knowledge
      description: 'Search TPG''s Knowledge Graph.


        Phase 0: Text-based search (ILIKE on name + description).

        Phase 1: Will add semantic search via pgvector embeddings.'
      operationId: recall_knowledge_memory_recall_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRecallRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecallResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memory/entity/{entity_id}:
    get:
      tags:
      - Memory
      summary: Get Entity
      description: Retrieve a specific entity by ID.
      operationId: get_entity_memory_entity__entity_id__get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/graph/lineage/{entity_id}:
    get:
      tags:
      - Intelligence
      summary: Trace Lineage
      description: Reconstructs the full upstream and downstream provenance tree of
        an entity.
      operationId: trace_lineage_intelligence_graph_lineage__entity_id__get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineageTraceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/graph/query:
    post:
      tags:
      - Intelligence
      summary: Graph Query
      description: 'Multi-stage graph retrieval engine.

        Answers natural questions like:

        - ''Why did we build Vendor Wallet?''

        - ''What is blocking the Mobile MVP?''

        - ''Trace the provenance of initiative X'''
      operationId: graph_query_intelligence_graph_query_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiStageGraphQueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiStageGraphQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/requirements/analyze:
    post:
      tags:
      - Intelligence
      summary: Analyze Requirement
      description: 'Analyzes a requirement or problem description for ambiguity.

        Identifies missing dimensions, scores completeness, and generates

        prioritized discovery questions according to PRD-0005 §9.'
      operationId: analyze_requirement_intelligence_requirements_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementAnalyzeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementAnalyzeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/requirements/ingest:
    post:
      tags:
      - Intelligence
      summary: Ingest Requirement
      description: Ingests a requirement into the Knowledge Graph with provenance
        tracking.
      operationId: ingest_requirement_intelligence_requirements_ingest_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementIngestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/decisions/evaluate:
    post:
      tags:
      - Intelligence
      summary: Evaluate Decision Options
      description: 'Evaluates competing solution options across Effort, Impact, Risk,
        and Confidence.

        Generates quantitative efficiency scores and trade-off comparisons.'
      operationId: evaluate_decision_options_intelligence_decisions_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionEvaluateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionEvaluateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/decisions/record:
    post:
      tags:
      - Intelligence
      summary: Record Decision
      description: Formulates a permanent ADR (Decision Record) and stores it in the
        Knowledge Graph.
      operationId: record_decision_intelligence_decisions_record_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRecordRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecordResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/prd/assess:
    post:
      tags:
      - Intelligence
      summary: Assess Prd Readiness
      description: 'Evaluates PRD readiness before drafting (PRD-0008 §7, §8, §9).

        Prevents blind PRD generation without validated problem and decisions.'
      operationId: assess_prd_readiness_intelligence_prd_assess_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRDAssessRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRDAssessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/prd/generate:
    post:
      tags:
      - Intelligence
      summary: Generate Prd Specification
      description: 'Synthesizes a complete, constitutional PRD conforming to PRD-0008
        §10.

        Enforces scope fencing (non-goals), functional requirements, and Gherkin acceptance
        criteria.'
      operationId: generate_prd_specification_intelligence_prd_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRDGenerateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRDGenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/prd/save:
    post:
      tags:
      - Intelligence
      summary: Save Prd Specification
      description: Drafts and permanently saves an immutable PRD in the Knowledge
        Graph with version management.
      operationId: save_prd_specification_intelligence_prd_save_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRDGenerateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRDSaveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /strategy/bets/evaluate:
    post:
      tags:
      - Strategy & Roadmap
      summary: Evaluate Strategic Bet
      description: Evaluates the viability of a strategic bet.
      operationId: evaluate_strategic_bet_strategy_bets_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetEvaluateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetEvaluateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /strategy/roadmap:
    post:
      tags:
      - Strategy & Roadmap
      summary: Generate Living Roadmap
      description: Sequences initiatives into living Now/Next/Later roadmap horizons.
      operationId: generate_living_roadmap_strategy_roadmap_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadmapGenerateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /strategy/align:
    post:
      tags:
      - Strategy & Roadmap
      summary: Score Initiative Alignment
      description: Scores strategic alignment of an initiative (0-100).
      operationId: score_initiative_alignment_strategy_align_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategicAlignRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategicAlignResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/analyze:
    post:
      tags:
      - Engineering Intelligence
      summary: Analyze PRD for technical implications
      description: Inspects a PRD's requirements to identify affected components,
        new components needed, dependencies, and technical risks. Does NOT invent
        architecture — only surfaces evidence-based implications.
      operationId: analyze_prd_engineering_analyze_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineeringAnalyzeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineeringAnalyzeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/breakdown:
    post:
      tags:
      - Engineering Intelligence
      summary: Decompose PRD into engineering work
      description: Breaks a PRD into Epics → Stories → Subtasks with acceptance criteria
        and effort estimates. Each story traces back to a specific requirement.
      operationId: decompose_prd_engineering_breakdown_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreakdownRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/handoff:
    post:
      tags:
      - Engineering Intelligence
      summary: Generate full engineering handoff
      description: Generates a complete engineering handoff document combining technical
        analysis, engineering breakdown, effort estimates, risks, and observability
        requirements.
      operationId: generate_handoff_engineering_handoff_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /qa/test-strategy:
    post:
      tags:
      - QA & Release Intelligence
      summary: Generate Test Strategy
      description: Generates a risk-based test strategy for a PRD.
      operationId: generate_test_strategy_qa_test_strategy_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestStrategyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestStrategyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /qa/test-cases:
    post:
      tags:
      - QA & Release Intelligence
      summary: Derive Test Cases
      description: Generates positive, negative, boundary, and error test cases from
        a requirement.
      operationId: derive_test_cases_qa_test_cases_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCaseRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /qa/release-readiness:
    post:
      tags:
      - QA & Release Intelligence
      summary: Assess Release Readiness
      description: Evidence-based release readiness assessment evaluating multiple
        quality gates.
      operationId: assess_release_readiness_qa_release_readiness_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseReadinessRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseReadinessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analytics/kpi:
    post:
      tags:
      - Analytics & Outcome Intelligence
      summary: Define Kpi
      operationId: define_kpi_analytics_kpi_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KPIRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPIResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analytics/scorecard:
    post:
      tags:
      - Analytics & Outcome Intelligence
      summary: Evaluate Scorecard
      operationId: evaluate_scorecard_analytics_scorecard_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScorecardRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorecardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /customer/signals:
    post:
      tags:
      - Customer Intelligence
      summary: Ingest Signal
      operationId: ingest_signal_customer_signals_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalIngestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /customer/problems/extract:
    post:
      tags:
      - Customer Intelligence
      summary: Extract Problem
      operationId: extract_problem_customer_problems_extract_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemExtractRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemExtractResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BetEvaluateRequest:
      properties:
        name:
          type: string
          title: Name
        hypothesis:
          type: string
          title: Hypothesis
        evidence_strength:
          type: number
          title: Evidence Strength
          default: 0.7
        investment_size:
          type: string
          title: Investment Size
          default: MEDIUM
        market_uncertainty:
          type: number
          title: Market Uncertainty
          default: 0.5
      type: object
      required:
      - name
      - hypothesis
      title: BetEvaluateRequest
    BetEvaluateResponse:
      properties:
        bet_name:
          type: string
          title: Bet Name
        viability_score:
          type: number
          title: Viability Score
        recommendation:
          type: string
          title: Recommendation
        evidence_strength:
          type: number
          title: Evidence Strength
        market_uncertainty:
          type: number
          title: Market Uncertainty
        validation_milestones:
          items:
            type: string
          type: array
          title: Validation Milestones
      type: object
      required:
      - bet_name
      - viability_score
      - recommendation
      - evidence_strength
      - market_uncertainty
      - validation_milestones
      title: BetEvaluateResponse
    BreakdownRequest:
      properties:
        prd_entity_id:
          type: string
          title: Prd Entity Id
          description: ID of the PRD entity
        prd_title:
          type: string
          title: Prd Title
          description: Title of the PRD
        requirements:
          items:
            $ref: '#/components/schemas/RequirementInput'
          type: array
          title: Requirements
          description: Requirements to decompose
      type: object
      required:
      - prd_entity_id
      - prd_title
      - requirements
      title: BreakdownRequest
    BreakdownResponse:
      properties:
        prd_entity_id:
          type: string
          title: Prd Entity Id
        prd_title:
          type: string
          title: Prd Title
        epics:
          items:
            $ref: '#/components/schemas/EpicSchema'
          type: array
          title: Epics
        total_stories:
          type: integer
          title: Total Stories
        total_estimated_hours:
          type: number
          title: Total Estimated Hours
        estimate_confidence:
          type: string
          title: Estimate Confidence
      type: object
      required:
      - prd_entity_id
      - prd_title
      - epics
      - total_stories
      - total_estimated_hours
      - estimate_confidence
      title: BreakdownResponse
    ConfidenceEnum:
      type: string
      enum:
      - confirmed
      - inferred
      - assumed
      - unknown
      title: ConfidenceEnum
    DecisionEvaluateRequest:
      properties:
        decision_question:
          type: string
          title: Decision Question
        options:
          items:
            $ref: '#/components/schemas/SolutionOptionSchema'
          type: array
          title: Options
      type: object
      required:
      - decision_question
      - options
      title: DecisionEvaluateRequest
    DecisionEvaluateResponse:
      properties:
        decision_question:
          type: string
          title: Decision Question
        top_recommendation:
          type: string
          title: Top Recommendation
        ranked_options:
          items:
            $ref: '#/components/schemas/RankedOptionResponse'
          type: array
          title: Ranked Options
        tradeoffs:
          items:
            type: string
          type: array
          title: Tradeoffs
      type: object
      required:
      - decision_question
      - top_recommendation
      - ranked_options
      - tradeoffs
      title: DecisionEvaluateResponse
    DecisionRecordRequest:
      properties:
        title:
          type: string
          title: Title
        decision_type:
          type: string
          title: Decision Type
          default: PRODUCT_INVESTMENT
        outcome:
          type: string
          title: Outcome
          default: APPROVED
        decision_question:
          type: string
          title: Decision Question
        context:
          type: string
          title: Context
        rationale:
          type: string
          title: Rationale
        options:
          items:
            $ref: '#/components/schemas/SolutionOptionSchema'
          type: array
          title: Options
        evidence_citations:
          items:
            type: string
          type: array
          title: Evidence Citations
        risks:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Risks
        expected_outcomes:
          items:
            type: string
          type: array
          title: Expected Outcomes
        initiative_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Initiative Id
        problem_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Problem Id
        requirement_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Requirement Id
      type: object
      required:
      - title
      - decision_question
      - context
      - rationale
      - options
      title: DecisionRecordRequest
    DecisionRecordResponse:
      properties:
        decision_id:
          type: string
          title: Decision Id
        title:
          type: string
          title: Title
        outcome:
          type: string
          title: Outcome
        confidence:
          type: number
          title: Confidence
        tradeoffs_count:
          type: integer
          title: Tradeoffs Count
      type: object
      required:
      - decision_id
      - title
      - outcome
      - confidence
      - tradeoffs_count
      title: DecisionRecordResponse
    DiscoveryQuestionSchema:
      properties:
        priority:
          type: integer
          title: Priority
        dimension:
          type: string
          title: Dimension
        question:
          type: string
          title: Question
        rationale:
          type: string
          title: Rationale
      type: object
      required:
      - priority
      - dimension
      - question
      - rationale
      title: DiscoveryQuestionSchema
    EngineeringAnalyzeRequest:
      properties:
        prd_entity_id:
          type: string
          title: Prd Entity Id
          description: ID of the PRD entity in the Knowledge Graph
        prd_title:
          type: string
          title: Prd Title
          description: Title of the PRD
        requirements:
          items:
            $ref: '#/components/schemas/RequirementInput'
          type: array
          title: Requirements
          description: List of functional requirements
      type: object
      required:
      - prd_entity_id
      - prd_title
      - requirements
      title: EngineeringAnalyzeRequest
    EngineeringAnalyzeResponse:
