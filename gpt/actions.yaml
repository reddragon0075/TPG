openapi: 3.1.0
info:
  title: TPG — The Product Guy
  description: |
    Backend intelligence service for TPG.
    Provides persistent Knowledge Graph memory, entity management,
    and graph traversal capabilities.
  version: 0.1.0

servers:
  - url: https://your-tpg-backend.example.com
    description: TPG Backend

paths:
  /health:
    get:
      operationId: healthCheck
      summary: System health check
      description: Verifies database connectivity and returns system status.
      responses:
        "200":
          description: System health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /memory/store:
    post:
      operationId: storeKnowledge
      summary: Store knowledge in TPG's memory
      description: |
        Store a piece of product intelligence in the Knowledge Graph.
        Use this whenever you need to remember something — a strategy,
        a decision, a customer problem, a requirement, or any fact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryStoreRequest"
      responses:
        "200":
          description: Knowledge stored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStoreResponse"

  /memory/recall:
    post:
      operationId: recallKnowledge
      summary: Search TPG's memory
      description: |
        Search the Knowledge Graph for relevant knowledge.
        Always check memory before claiming you don't know something.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryRecallRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryRecallResponse"

  /memory/entity/{entity_id}:
    get:
      operationId: getEntity
      summary: Get a specific entity
      description: Retrieve a specific knowledge entity by its ID.
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entity details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"

  /memory/entities/{entity_type}:
    get:
      operationId: listEntities
      summary: List entities by type
      description: |
        List all active entities of a given type.
        Types include: strategy, objective, initiative, requirement,
        decision, customer, signal, problem, opportunity, metric, etc.
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityResponse"

  /memory/relationship:
    post:
      operationId: createRelationship
      summary: Connect two entities
      description: |
        Create a typed, directional relationship between two entities.
        Use this to build the Knowledge Graph structure — linking
        strategies to objectives, requirements to decisions, etc.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipCreateRequest"
      responses:
        "200":
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipResponse"

  /memory/graph:
    post:
      operationId: queryGraph
      summary: Explore the Knowledge Graph
      description: |
        Traverse the Knowledge Graph from a starting entity to find
        all connected entities. Use this to understand relationships
        and trace connections across product intelligence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphQueryRequest"
      responses:
        "200":
          description: Graph traversal results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphQueryResponse"

  /memory/stats:
    get:
      operationId: memoryStats
      summary: Knowledge Graph statistics
      description: Returns counts of entities and relationships in the workspace.
      responses:
        "200":
          description: Memory statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_entities:
                    type: integer
                  total_relationships:
                    type: integer
                  entities_by_type:
                    type: object

  /intelligence/requirements/analyze:
    post:
      operationId: analyzeRequirement
      summary: Analyze requirement ambiguity & completeness
      description: |
        Analyzes a product requirement or problem statement for missing dimensions
        (user, impact, workaround, evidence) and produces prioritized discovery questions
        (PRD-0005 §9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementAnalyzeRequest"
      responses:
        "200":
          description: Ambiguity analysis with prioritized questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementAnalyzeResponse"

  /intelligence/requirements/ingest:
    post:
      operationId: ingestRequirement
      summary: Ingest requirement into Knowledge Graph
      description: Ingests a validated requirement with provenance and links to parent Initiative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementIngestRequest"
      responses:
        "200":
          description: Requirement ingested successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementIngestResponse"

  /intelligence/decisions/evaluate:
    post:
      operationId: evaluateDecisionOptions
      summary: Evaluate solution options & trade-offs
      description: |
        Compares competing options across Impact, Effort, Risk, and Confidence
        using TPG's quantitative scoring formula (PRD-0006).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionEvaluateRequest"
      responses:
        "200":
          description: Ranked options and recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionEvaluateResponse"

  /intelligence/decisions/record:
    post:
      operationId: recordDecision
      summary: Record product decision (ADR)
      description: Formulates and records an immutable decision in the Knowledge Graph with governing links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRecordRequest"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionRecordResponse"

  /intelligence/graph/query:
    post:
      operationId: queryKnowledgeGraph
      summary: Multi-stage graph retrieval
      description: |
        Answers complex product provenance questions like "Why did we build Vendor Wallet?",
        "What is blocking the Mobile MVP?", or "Trace impact of changing X".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiStageGraphQueryRequest"
      responses:
        "200":
          description: Synthesized narrative and evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiStageGraphQueryResponse"

  /intelligence/graph/lineage/{entity_id}:
    get:
      operationId: traceLineage
      summary: Trace full upstream and downstream lineage
      description: Returns the entire provenance tree from root problem to ultimate KPIs.
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete lineage tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineageTraceResponse"

  /intelligence/graph/path:
    get:
      operationId: findShortestPath
      summary: Find shortest connection between two entities
      parameters:
        - name: source_id
          in: query
          required: true
          schema:
            type: string
        - name: target_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shortest path traversal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortestPathResponse"

  /intelligence/prd/assess:
    post:
      operationId: assessPrdReadiness
      summary: Assess PRD readiness gates
      description: Evaluates whether sufficient validated problem, requirements, decisions, and evidence exist before drafting a PRD (PRD-0008 §7-§9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PRDAssessRequest"
      responses:
        "200":
          description: Readiness assessment with scores and missing items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PRDAssessResponse"

  /intelligence/prd/generate:
    post:
      operationId: generatePrdSpecification
      summary: Synthesize constitutional PRD specification
      description: Generates an execution-ready PRD with scope fencing (non-goals), functional requirements, edge cases, and Gherkin acceptance criteria (PRD-0008 §10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PRDGenerateRequest"
      responses:
        "200":
          description: Drafted PRD specification with markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PRDGenerateResponse"

  /intelligence/prd/save:
    post:
      operationId: savePrdSpecification
      summary: Save PRD to Knowledge Graph
      description: Saves an immutable PRD in the Knowledge Graph with version management (v1, v2) and links to parent Initiative and Decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PRDGenerateRequest"
      responses:
        "200":
          description: Saved PRD confirmation with ID and version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PRDSaveResponse"

  /intelligence/prd/{prd_id}:
    get:
      operationId: getPrdSpecification
      summary: Retrieve PRD by ID
      description: Retrieves a saved PRD from the Knowledge Graph.
      parameters:
        - name: prd_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PRD entity details and markdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  prd_id:
                    type: string
                  title:
                    type: string
                  problem_statement:
                    type: string
                  version:
                    type: integer
                  status:
                    type: string
                  non_goals:
                    type: array
                    items:
                      type: string
                  goals:
                    type: array
                    items:
                      type: string
                  markdown:
                    type: string

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        database:
          type: string
        entity_count:
          type: integer

    MemoryStoreRequest:
      type: object
      required:
        - name
      properties:
        entity_type:
          type: string
          enum:
            - fact
            - strategy
            - objective
            - strategic_bet
            - initiative
            - requirement
            - decision
            - prd
            - customer
            - contact
            - signal
            - problem
            - opportunity
            - commitment
            - metric
            - kpi
            - experiment
            - outcome
            - learning
          default: fact
        name:
          type: string
          description: Short name or title for this knowledge
        description:
          type: string
          description: Detailed description or content
        properties:
          type: object
          description: Additional structured properties
          default: {}
        source:
          type: string
          default: user
        confidence:
          type: string
          enum: [confirmed, inferred, assumed, unknown]
          default: confirmed

    MemoryStoreResponse:
      type: object
      properties:
        entity_id:
          type: string
        entity_type:
          type: string
        name:
          type: string
        message:
          type: string

    MemoryRecallRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: What are you looking for?
        entity_type:
          type: string
          description: Filter by entity type
        limit:
          type: integer
          default: 20

    MemoryRecallResponse:
      type: object
      properties:
        query:
          type: string
        total_results:
          type: integer
        entities:
          type: array
          items:
            $ref: "#/components/schemas/EntityResponse"

    EntityResponse:
      type: object
      properties:
        id:
          type: string
        entity_type:
          type: string
        name:
          type: string
        description:
          type: string
        properties:
          type: object
        source:
          type: string
        confidence:
          type: string
        status:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RelationshipCreateRequest:
      type: object
      required:
        - source_entity_id
        - target_entity_id
        - relationship_type
      properties:
        source_entity_id:
          type: string
        target_entity_id:
          type: string
        relationship_type:
          type: string
          enum:
            - belongs_to
            - contains
            - part_of
            - created_from
            - depends_on
            - blocks
            - supports
            - contradicts
            - supersedes
            - implements
            - tests
            - traces_to
            - measured_by
            - requested_by
            - affects
            - resolves
            - caused_by
            - relates_to
        properties:
          type: object
          default: {}
        confidence:
          type: string
          enum: [confirmed, inferred, assumed, unknown]
          default: confirmed

    RelationshipResponse:
      type: object
      properties:
        id:
          type: string
        source_entity_id:
          type: string
        target_entity_id:
          type: string
        relationship_type:
          type: string
        properties:
          type: object
        confidence:
          type: string
        created_at:
          type: string
          format: date-time

    GraphQueryRequest:
      type: object
      required:
        - entity_id
      properties:
        entity_id:
          type: string
          description: Starting entity ID
        relationship_types:
          type: array
          items:
            type: string
          description: Filter by relationship type
        depth:
          type: integer
          default: 1
          minimum: 1
          maximum: 3

    GraphQueryResponse:
      type: object
      properties:
        center_entity:
          $ref: "#/components/schemas/EntityResponse"
        neighbors:
          type: array
          items:
            type: object
            properties:
              entity:
                $ref: "#/components/schemas/EntityResponse"
              relationship_type:
                type: string
              direction:
                type: string
        total_connections:
          type: integer

    RequirementAnalyzeRequest:
      type: object
      required:
        - statement
      properties:
        statement:
          type: string
          description: Raw requirement or problem statement
        context:
          type: object
          description: Optional surrounding context

    RequirementAnalyzeResponse:
      type: object
      properties:
        is_product_requirement:
          type: boolean
        detected_type:
          type: string
        ambiguity_score:
          type: number
        completeness_score:
          type: number
        missing_dimensions:
          type: array
          items:
            type: string
        prioritized_questions:
          type: array
          items:
            type: object
            properties:
              priority:
                type: integer
              dimension:
                type: string
              question:
                type: string
              rationale:
                type: string
        suggested_jtbd:
          type: array
          items:
            type: object
            properties:
              situation:
                type: string
              motivation:
                type: string
              expected_outcome:
                type: string

    RequirementIngestRequest:
      type: object
      required:
        - raw_text
        - title
      properties:
        raw_text:
          type: string
        title:
          type: string
        initiative_id:
          type: string
        source:
          type: string
          default: chatgpt
        source_reference:
          type: string

    RequirementIngestResponse:
      type: object
      properties:
        entity_id:
          type: string
        entity_type:
          type: string
        title:
          type: string
        ambiguity_score:
          type: number
        discovery_state:
          type: string
        next_questions:
          type: array
          items:
            type: string

    DecisionEvaluateRequest:
      type: object
      required:
        - decision_question
        - options
      properties:
        decision_question:
          type: string
        options:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              description:
                type: string
              effort:
                type: number
                default: 3.0
              impact:
                type: number
                default: 3.0
              risk:
                type: number
                default: 2.0
              confidence:
                type: number
                default: 0.8

    DecisionEvaluateResponse:
      type: object
      properties:
        decision_question:
          type: string
        top_recommendation:
          type: string
        ranked_options:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              score:
                type: number
              analysis:
                type: string
        tradeoffs:
          type: array
          items:
            type: string

    DecisionRecordRequest:
      type: object
      required:
        - title
        - decision_question
        - context
        - rationale
        - options
      properties:
        title:
          type: string
        decision_type:
          type: string
          default: PRODUCT_INVESTMENT
        outcome:
          type: string
          default: APPROVED
        decision_question:
          type: string
        context:
          type: string
        rationale:
          type: string
        options:
          type: array
          items:
            type: object
        evidence_citations:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: object
        expected_outcomes:
          type: array
          items:
            type: string
        initiative_id:
          type: string
        problem_id:
          type: string
        requirement_id:
          type: string

    DecisionRecordResponse:
      type: object
      properties:
        decision_id:
          type: string
        title:
          type: string
        outcome:
          type: string
        confidence:
          type: number
        tradeoffs_count:
          type: integer

    MultiStageGraphQueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
        entity_id:
          type: string
        entity_type:
          type: string

    MultiStageGraphQueryResponse:
      type: object
      properties:
        query:
          type: string
        intent:
          type: string
        narrative_summary:
          type: string
        evidence:
          type: array
          items:
            type: object
            properties:
              entity_id:
                type: string
              entity_type:
                type: string
              name:
                type: string
              relationship:
                type: string
              confidence:
                type: string
        total_nodes:
          type: integer
        total_edges:
          type: integer
        confidence:
          type: string

    LineageTraceResponse:
      type: object
      properties:
        entity_id:
          type: string
        root_name:
          type: string
        root_type:
          type: string
        upstream_count:
          type: integer
        downstream_count:
          type: integer
        provenance_chain:
          type: array
          items:
            type: string

    ShortestPathResponse:
      type: object
      properties:
        source_id:
          type: string
        target_id:
          type: string
        path_found:
          type: boolean
        distance:
          type: integer
        path_names:
          type: array
          items:
            type: string

    PRDAssessRequest:
      type: object
      properties:
        problem:
          type: string
        requirements:
          type: array
          items:
            type: string
        decision_rationale:
          type: string
        evidence:
          type: array
          items:
            type: string
        success_metric:
          type: string

    PRDAssessResponse:
      type: object
      properties:
        level:
          type: string
        overall_score:
          type: number
        dimension_scores:
          type: object
        missing_critical_items:
          type: array
          items:
            type: string
        readiness_notes:
          type: string

    PRDGenerateRequest:
      type: object
      required:
        - title
        - problem
        - raw_requirements
      properties:
        title:
          type: string
        problem:
          type: string
        raw_requirements:
          type: array
          items:
            type: string
        decision_rationale:
          type: string
        evidence:
          type: array
          items:
            type: string
        target_personas:
          type: array
          items:
            type: string
        non_goals:
          type: array
          items:
            type: string
        success_metric:
          type: string
        initiative_id:
          type: string
        decision_id:
          type: string

    PRDGenerateResponse:
      type: object
      properties:
        title:
          type: string
        version:
          type: integer
        status:
          type: string
        executive_summary:
          type: object
        goals:
          type: array
          items:
            type: string
        non_goals:
          type: array
          items:
            type: string
        functional_requirements_count:
          type: integer
        acceptance_criteria_count:
          type: integer
        markdown:
          type: string

    PRDSaveResponse:
      type: object
      properties:
        prd_id:
          type: string
        title:
          type: string
        version:
          type: integer
        status:
          type: string
        markdown_length:
          type: integer

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - ApiKeyAuth: []
