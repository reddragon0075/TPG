openapi: 3.1.0
info:
  title: TPG — The Product Guy
  description: TPG Backend Intelligence Service. Powers the Knowledge Graph, Connector
    Framework, and Specialist Agent orchestration behind the unified TPG identity
    in ChatGPT.
  version: 0.1.0
servers:
  - url: https://carriers-crafts-inflation-zealand.trycloudflare.com
    description: TPG Live Intelligence Backend (Cloudflare Tunnel)
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      description: 'System health check.


        Verifies database connectivity and returns basic system info.

        Called by monitoring and by the Custom GPT to verify availability.'
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /memory/store:
    post:
      tags:
      - Memory
      summary: Store Knowledge
      description: 'Store a piece of knowledge in TPG''s Knowledge Graph.


        This is the primary write path for all product intelligence.

        ChatGPT calls this whenever TPG needs to remember something.'
      operationId: store_knowledge_memory_store_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryStoreRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryStoreResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memory/recall:
    post:
      tags:
      - Memory
      summary: Recall Knowledge
      description: 'Search TPG''s Knowledge Graph.


        Phase 0: Text-based search (ILIKE on name + description).

        Phase 1: Will add semantic search via pgvector embeddings.'
      operationId: recall_knowledge_memory_recall_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRecallRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecallResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memory/entity/{entity_id}:
    get:
      tags:
      - Memory
      summary: Get Entity
      description: Retrieve a specific entity by ID.
      operationId: get_entity_memory_entity__entity_id__get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Memory
      summary: Update Entity
      description: Update an existing entity.
      operationId: update_entity_memory_entity__entity_id__patch
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryStoreRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Memory
      summary: Archive Entity
      description: 'Archive an entity (soft delete).

        TPG never hard-deletes knowledge — it archives.'
      operationId: archive_entity_memory_entity__entity_id__delete
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memory/entities/{entity_type}:
    get:
      tags:
      - Memory
      summary: List Entities
      description: List all active entities of a given type.
      operationId: list_entities_memory_entities__entity_type__get
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
          title: Entity Type
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityResponse'
                title: Response List Entities Memory Entities  Entity Type  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memory/relationship:
    post:
      tags:
      - Memory
      summary: Create Relationship
      description: Create a typed relationship between two entities.
      operationId: create_relationship_memory_relationship_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memory/graph:
    post:
      tags:
      - Memory
      summary: Query Graph
      description: 'Traverse the Knowledge Graph from a starting entity.


        Returns the center entity and all connected neighbors

        within the specified depth (Phase 0: depth=1 only).'
      operationId: query_graph_memory_graph_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memory/stats:
    get:
      tags:
      - Memory
      summary: Memory Stats
      description: Return Knowledge Graph statistics for this workspace.
      operationId: memory_stats_memory_stats_get
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/requirements/analyze:
    post:
      tags:
      - Intelligence
      summary: Analyze Requirement
      description: 'Analyzes a requirement or problem description for ambiguity.

        Identifies missing dimensions, scores completeness, and generates

        prioritized discovery questions according to PRD-0005 §9.'
      operationId: analyze_requirement_intelligence_requirements_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementAnalyzeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementAnalyzeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/requirements/ingest:
    post:
      tags:
      - Intelligence
      summary: Ingest Requirement
      description: Ingests a requirement into the Knowledge Graph with provenance
        tracking.
      operationId: ingest_requirement_intelligence_requirements_ingest_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementIngestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/decisions/evaluate:
    post:
      tags:
      - Intelligence
      summary: Evaluate Decision Options
      description: 'Evaluates competing solution options across Effort, Impact, Risk,
        and Confidence.

        Generates quantitative efficiency scores and trade-off comparisons.'
      operationId: evaluate_decision_options_intelligence_decisions_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionEvaluateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionEvaluateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/decisions/record:
    post:
      tags:
      - Intelligence
      summary: Record Decision
      description: Formulates a permanent ADR (Decision Record) and stores it in the
        Knowledge Graph.
      operationId: record_decision_intelligence_decisions_record_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRecordRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecordResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/graph/query:
    post:
      tags:
      - Intelligence
      summary: Graph Query
      description: 'Multi-stage graph retrieval engine.

        Answers natural questions like:

        - ''Why did we build Vendor Wallet?''

        - ''What is blocking the Mobile MVP?''

        - ''Trace the provenance of initiative X'''
      operationId: graph_query_intelligence_graph_query_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiStageGraphQueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiStageGraphQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/graph/lineage/{entity_id}:
    get:
      tags:
      - Intelligence
      summary: Trace Lineage
      description: Reconstructs the full upstream and downstream provenance tree of
        an entity.
      operationId: trace_lineage_intelligence_graph_lineage__entity_id__get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineageTraceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/graph/path:
    get:
      tags:
      - Intelligence
      summary: Shortest Path
      description: Finds the shortest relationship path between two entities in the
        workspace.
      operationId: shortest_path_intelligence_graph_path_get
      parameters:
      - name: source_id
        in: query
        required: true
        schema:
          type: string
          title: Source Id
      - name: target_id
        in: query
        required: true
        schema:
          type: string
          title: Target Id
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortestPathResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/prd/assess:
    post:
      tags:
      - Intelligence
      summary: Assess Prd Readiness
      description: 'Evaluates PRD readiness before drafting (PRD-0008 §7, §8, §9).

        Prevents blind PRD generation without validated problem and decisions.'
      operationId: assess_prd_readiness_intelligence_prd_assess_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRDAssessRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRDAssessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/prd/generate:
    post:
      tags:
      - Intelligence
      summary: Generate Prd Specification
      description: 'Synthesizes a complete, constitutional PRD conforming to PRD-0008
        §10.

        Enforces scope fencing (non-goals), functional requirements, and Gherkin acceptance
        criteria.'
      operationId: generate_prd_specification_intelligence_prd_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRDGenerateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRDGenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/prd/save:
    post:
      tags:
      - Intelligence
      summary: Save Prd Specification
      description: Drafts and permanently saves an immutable PRD in the Knowledge
        Graph with version management.
      operationId: save_prd_specification_intelligence_prd_save_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRDGenerateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRDSaveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/prd/{prd_id}:
    get:
      tags:
      - Intelligence
      summary: Get Prd Specification
      description: Retrieves a saved PRD from the Knowledge Graph by its ID.
      operationId: get_prd_specification_intelligence_prd__prd_id__get
      parameters:
      - name: prd_id
        in: path
        required: true
        schema:
          type: string
          title: Prd Id
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/analyze:
    post:
      tags:
      - Engineering Intelligence
      summary: Analyze PRD for technical implications
      description: Inspects a PRD's requirements to identify affected components,
        new components needed, dependencies, and technical risks. Does NOT invent
        architecture — only surfaces evidence-based implications.
      operationId: analyze_prd_engineering_analyze_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineeringAnalyzeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineeringAnalyzeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/design:
    post:
      tags:
      - Engineering Intelligence
      summary: Generate technical design specification
      description: Generates a structured technical design document from PRD requirements.
        Includes components, data flow, API changes, failure modes, and observability.
      operationId: generate_design_engineering_design_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicalDesignRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalDesignResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/adr:
    post:
      tags:
      - Engineering Intelligence
      summary: Create Architecture Decision Record
      description: Creates and persists an ADR in the Knowledge Graph. ADRs document
        major technical decisions with context, alternatives, and consequences for
        organizational memory.
      operationId: create_adr_engineering_adr_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ADRCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ADRCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/breakdown:
    post:
      tags:
      - Engineering Intelligence
      summary: Decompose PRD into engineering work
      description: Breaks a PRD into Epics → Stories → Subtasks with acceptance criteria
        and effort estimates. Each story traces back to a specific requirement.
      operationId: decompose_prd_engineering_breakdown_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreakdownRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/estimate:
    post:
      tags:
      - Engineering Intelligence
      summary: Estimate effort for engineering work
      description: Calculates effort estimates with confidence levels. Estimate =
        Development + Testing + Integration + Migration + Deployment + Contingency.
        ⚠️ Estimates are labeled as estimates, never commitments.
      operationId: estimate_effort_engineering_estimate_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EffortEstimateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffortEstimateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/capacity:
    post:
      tags:
      - Engineering Intelligence
      summary: Analyze team capacity vs requirements
      description: Compares required effort against available team capacity. Detects
        overload and suggests mitigation strategies.
      operationId: analyze_capacity_engineering_capacity_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/tech-debt:
    post:
      tags:
      - Engineering Intelligence
      summary: Record technical debt
      description: Records technical debt as a first-class entity in the Knowledge
        Graph. Tech debt must be connected to product/business impact — not merely
        labeled as debt.
      operationId: record_tech_debt_engineering_tech_debt_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechDebtRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechDebtResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/tech-risk:
    post:
      tags:
      - Engineering Intelligence
      summary: Record technical risk
      description: Records a technical risk in the Knowledge Graph. Links to related
        initiatives where applicable.
      operationId: record_tech_risk_engineering_tech_risk_post
      parameters:
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechRiskRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechRiskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /engineering/drift/{prd_id}:
    get:
      tags:
      - Engineering Intelligence
      summary: Detect implementation drift
      description: Compares PRD requirements against engineering execution status.
        Identifies missing, incomplete, diverged, and untracked work.
      operationId: detect_drift_engineering_drift__prd_id__get
      parameters:
      - name: prd_id
        in: path
        required: true
        schema:
          type: string
          title: Prd Id
      - name: X-Workspace-ID
        in: header
        required: false
        schema:
          type: string
          title: X-Workspace-Id
      responses:
        '200':
